name: Organizar archivos del primer capitulo
on:
  push:
    paths:
      - .github/workflows/organizar-capitulo-01.yml

permissions:
  contents: write

jobs:
  organizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer solo el capitulo 1 y retirar el ZIP
        shell: bash
        run: |
          set -euo pipefail
          archivo="libro-tidyactuarial-integrado-revisado.zip"
          for ruta in 01-tasas-interes.qmd index.qmd estilo-libro.scss README.md .gitignore R/configuracion-libro.R; do
            mkdir -p "$(dirname "$ruta")"
            unzip -p "$archivo" "libro-tidyactuarial/$ruta" > "$ruta"
          done

          cat > _quarto.yml <<'QUARTO'
          project:
            type: book
            output-dir: _book
            execute-dir: project

          lang: es

          book:
            title: "Matemática Actuarial con R y tidyactuarial"
            subtitle: "Desarrollos matemáticos y cálculo reproducible"
            author: "Julián Mauricio Fajardo"
            repo-url: https://github.com/JulianFajardo1908/libro-tidyactuarial
            repo-actions: [issue, source]
            site-url: https://julianfajardo1908.github.io/libro-tidyactuarial/
            chapters:
              - index.qmd
              - 01-tasas-interes.qmd
            page-footer:
              left: "Julián Mauricio Fajardo"
              right:
                - text: "Paquete tidyactuarial"
                  href: https://julianfajardo1908.github.io/tidyactuarial/
                - text: "CRAN"
                  href: https://cran.r-project.org/package=tidyactuarial

          format:
            html:
              theme: [cosmo, estilo-libro.scss]
              toc: true
              toc-depth: 2
              number-sections: true
              html-math-method: mathjax
              code-overflow: wrap
              code-copy: true

          execute:
            echo: true
            warning: false
            message: false
            error: false
          QUARTO

          rm "$archivo"
          rm .github/workflows/organizar-capitulo-01.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Descomprimir libro y conservar solo el capitulo 1"
          git push origin HEAD:main
