name: Compilar y publicar libro Quarto

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "_quarto.yml"
      - "*.qmd"
      - "R/**"
      - "estilo-libro.scss"
      - ".github/workflows/publicar-libro.yml"

permissions:
  contents: write

concurrency:
  group: publicacion-libro
  cancel-in-progress: true

jobs:
  compilar-publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos del libro
        uses: actions/checkout@v4

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar paquetes de R
        shell: bash
        run: |
          Rscript -e 'install.packages(c("tidyactuarial", "tidyverse", "knitr", "lubridate"), repos = "https://cloud.r-project.org")'

      - name: Verificar version de tidyactuarial
        shell: bash
        run: |
          Rscript -e 'stopifnot(utils::packageVersion("tidyactuarial") >= "0.2.0"); print(utils::packageVersion("tidyactuarial"))'

      - name: Compilar el libro en HTML
        run: quarto render --to html

      - name: Verificar los dos capitulos HTML
        shell: bash
        run: |
          test -f _book/index.html
          test -f _book/01-tasas-interes.html
          test -f _book/02-ecuaciones-valor.html

      - name: Conservar HTML compilado
        uses: actions/upload-artifact@v4
        with:
          name: libro-quarto-html
          path: _book/
          retention-days: 14

      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
